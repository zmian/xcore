name: Documentation

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Export selected Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Resolve documentation version
        id: docs
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="main"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build DocC static site
        run: |
          make build-docc \
            DOCC_OUTPUT_PATH="$PWD/.build/docc/${{ steps.docs.outputs.version }}" \
            DOCC_VERSION="${{ steps.docs.outputs.version }}"

      - name: Add redirect
        run: |
          cat > "$PWD/.build/docc/${{ steps.docs.outputs.version }}/index.html" <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=documentation/xcore/">
            </head>
            <body>
              <a href="documentation/xcore/">Xcore documentation</a>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/docc

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
